apiVersion: apps/v1
kind: Deployment
metadata:
  name: new-api
  namespace: new-api-cn
  labels:
    app.kubernetes.io/name: new-api
    app.kubernetes.io/part-of: new-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: new-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: new-api
        app.kubernetes.io/part-of: new-api
    spec:
      serviceAccountName: new-api
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: acr-pull
      securityContext:
        fsGroup: 1000
      containers:
        - name: new-api
          image: new-api:bootstrap
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: SQL_DSN
              valueFrom:
                secretKeyRef:
                  name: new-api
                  key: SQL_DSN
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: new-api
                  key: SESSION_SECRET
            - name: CRYPTO_SECRET
              valueFrom:
                secretKeyRef:
                  name: new-api
                  key: CRYPTO_SECRET
          envFrom:
            - configMapRef:
                name: new-api
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: new-api-data
