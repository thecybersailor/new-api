apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: new-api
  namespace: new-api-cn
  annotations:
    alb.ingress.kubernetes.io/ssl-redirect: 'true'
    alb.ingress.kubernetes.io/actions.www-redirect: |
      [{"type":"Redirect","RedirectConfig":{"host":"dantoken.cn","path":"${path}","port":"443","protocol":"https","query":"${query}","httpCode":"301"}}]
spec:
  ingressClassName: alb
  tls:
    - hosts:
        - dantoken.cn
        - www.dantoken.cn
      secretName: tls-dantoken-cn
  rules:
    - host: dantoken.cn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: new-api
                port:
                  number: 80
    - host: www.dantoken.cn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: www-redirect
                port:
                  name: use-annotation
