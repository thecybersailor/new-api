apiVersion: v1
kind: Service
metadata:
  name: new-api
  namespace: new-api
  labels:
    app.kubernetes.io/name: new-api
spec:
  type: LoadBalancer
  loadBalancerClass: eks.amazonaws.com/nlb
  selector:
    app.kubernetes.io/name: new-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
